<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #e4eaf1 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .header {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      padding: 32px 24px;
      color: #ffffff;
      text-align: center;
      position: relative;
    }

    .header-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 10px;
      backdrop-filter: blur(4px);
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.85;
      margin-top: 6px;
    }

    .form-body {
      padding: 28px 24px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    .input-group label i {
      color: #6366f1;
      font-size: 15px;
    }

    .input-group input,
    .input-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      color: #1f2937;
      background-color: #f9fafb;
      transition: all 0.2s ease;
      outline: none;
    }

    .input-group input:focus,
    .input-group textarea:focus {
      border-color: #6366f1;
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .input-group textarea {
      resize: none;
      height: 80px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
    }

    .submit-btn:disabled {
      background: #9ca3af;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* 완료 화면 디자인 */
    .success-card {
      display: none;
      padding: 48px 24px;
      text-align: center;
    }

    .success-icon {
      width: 72px;
      height: 72px;
      background: #e0e7ff;
      color: #4f46e5;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      margin: 0 auto 20px;
    }

    .success-card h2 {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    .success-card p {
      font-size: 15px;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 헤더 영역 -->
    <div class="header">
      <span class="header-badge">🌿 2026 Season MT</span>
      <h1>경주 MT 사전 조사</h1>
      <p>즐거운 MT를 위해 여러분의 의견을 알려주세요!</p>
    </div>

    <!-- 입력 폼 영역 -->
    <form id="mtForm" class="form-body" onsubmit="handleFormSubmit(this); return false;">
      <div class="input-group">
        <label for="name"><i class="fa-solid fa-user"></i> 이름</label>
        <input type="text" id="name" name="name" required placeholder="이름을 입력해주세요">
      </div>

      <div class="input-group">
        <label for="email"><i class="fa-solid fa-envelope"></i> 이메일</label>
        <input type="email" id="email" name="email" required placeholder="example@email.com">
      </div>

      <div class="input-group">
        <label for="lunch"><i class="fa-solid fa-utensils"></i> 점심 메뉴 먹고 싶은 거</label>
        <input type="text" id="lunch" name="lunch" required placeholder="예: 황남비빔밥, 쌈밥, 순두부찌개">
      </div>

      <div class="input-group">
        <label for="destination"><i class="fa-solid fa-location-dot"></i> 경주 가고 싶은 곳</label>
        <textarea id="destination" name="destination" required placeholder="예: 황리단길 카페거리, 첨성대 야경, 경주월드"></textarea>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">확인</button>
    </form>

    <!-- 완료 메시지 영역 -->
    <div id="successCard" class="success-card">
      <div class="success-icon">
        <i class="fa-solid fa-check"></i>
      </div>
      <h2>참여해주셔서 감사합니다.</h2>
      <p>의견을 바탕으로 알찬 경주 MT를 준비하겠습니다!</p>
    </div>
  </div>

  <script>
    function handleFormSubmit(formObject) {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 제출 중...';

      // 백엔드 함수 호출
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onFailure)
        .submitData(formObject);
    }

    function onSuccess(response) {
      if (response.success) {
        document.getElementById('mtForm').style.display = 'none';
        document.getElementById('successCard').style.display = 'block';
      } else {
        alert('저장 중 오류가 발생했습니다: ' + response.error);
        resetButton();
      }
    }

    function onFailure(error) {
      alert('요청 처리 오류: ' + error.message);
      resetButton();
    }

    function resetButton() {
      const btn = document.getElementById('submitBtn');
      btn.disabled = false;
      btn.innerText = '확인';
    }
  </script>
</body>
</html>
